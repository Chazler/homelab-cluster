argo-cd:
  fullnameOverride: argocd
  
  global:
    logging:
      level: info
      format: json
  
  crds:
    annotations:
      argocd.argoproj.io/sync-options: ServerSideApply=true
  
  configs:
    cm:
      create: true
      url: https://argocd.joeriberman.nl
      oidc.config: |
        name: Authentik
        issuer: https://auth.joeriberman.nl/application/o/argocd-oidc/
        clientID: $argocd-oidc:client-id
        clientSecret: $argocd-oidc:client-secret
        requestedScopes:
          - openid
          - profile
          - email

    rbac:
      policy.default: role:readonly
      policy.csv: |
        g, joeriberman@gmail.com, role:admin

    params:
      server.insecure: true
  
  controller:
    replicas: 1
  
  server:
    replicas: 1
    httproute:
      labels: { "authentik-forward-auth": "true" }
      enabled: true
      hostnames:
        - argocd.joeriberman.nl
      parentRefs:
        - group: gateway.networking.k8s.io
          kind: Gateway
          name: envoy-gateway
          namespace: envoy-gateway
          sectionName: web-https
  
  repoServer:
    replicas: 1
  
  redis:
    enabled: true
  
  dex:
    enabled: false
  
  notifications:
    enabled: false
  
  applicationSet:
    enabled: true
