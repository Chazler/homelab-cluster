apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: private-applications
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions:
    - missingkey=error
  generators:
    - git:
        repoURL: git@github.com:Chazler/homelab-private.git
        revision: main
        directories:
          - path: "apps/*"
  template:
    metadata:
      name: '{{ .path.basename }}'
    spec:
      project: '{{ if eq .path.basename "services" }}private-services-admin{{ else }}private{{ end }}'
      source:
        repoURL: git@github.com:Chazler/homelab-private.git
        targetRevision: main
        path: '{{ .path.path }}'
      destination:
        server: https://kubernetes.default.svc
        namespace: '{{ .path.basename }}'
      ignoreDifferences:
        # Bound PVCs have spec.volumeName populated by the cluster; Helm
        # templates omit it, causing permanent false drift under SSA.
        - group: ""
          kind: PersistentVolumeClaim
          jsonPointers:
            - /spec/volumeName
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - ServerSideApply=true
          - RespectIgnoreDifferences=true
