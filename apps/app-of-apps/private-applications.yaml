apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: private-applications
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions:
    - missingkey=error
  generators:
    - git:
        repoURL: git@github.com:Chazler/homelab-private.git
        revision: main
        directories:
          - path: "apps/*"
          - path: "apps/archive"
            exclude: true
  template:
    metadata:
      name: '{{ .path.basename }}'
    spec:
      project: '{{ if eq .path.basename "hermes" }}private-hermes-admin{{ else }}private{{ end }}'
      source:
        repoURL: git@github.com:Chazler/homelab-private.git
        targetRevision: main
        path: '{{ .path.path }}'
        helm:
          releaseName: '{{ if eq .path.basename "media-stack" }}jellyfin{{ else if has .path.basename (list "adguard" "umami" "polylearn" "idea-triage" "n8n" "hermes" "postgres" "services-foundation") }}services{{ else }}{{ .path.basename }}{{ end }}'
      destination:
        server: https://kubernetes.default.svc
        namespace: '{{ if eq .path.basename "media-stack" }}jellyfin{{ else if has .path.basename (list "adguard" "umami" "polylearn" "idea-triage" "n8n" "hermes" "postgres" "services-foundation") }}services{{ else }}{{ .path.basename }}{{ end }}'
      ignoreDifferences:
        # Bound PVCs have spec.volumeName populated by the cluster; Helm
        # templates omit it, causing permanent false drift under SSA.
        - group: ""
          kind: PersistentVolumeClaim
          jsonPointers:
            - /spec/volumeName
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - ServerSideApply=true
          - RespectIgnoreDifferences=true
