longhorn:
  defaultSettings:
    # The cluster has two storage nodes, so three replicas can never become healthy.
    defaultReplicaCount: 2
  persistence:
    # The wrapper chart defines platform-rwo below; avoid two default classes.
    defaultClass: false

storageClass:
  name: platform-rwo
  provisioner: driver.longhorn.io
  reclaimPolicy: Retain
  allowVolumeExpansion: true
  isDefault: true

observabilityStorageClass:
  name: observability-rwo
  provisioner: driver.longhorn.io
  reclaimPolicy: Retain
  allowVolumeExpansion: true
  numberOfReplicas: "1"
