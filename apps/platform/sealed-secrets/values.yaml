sealed-secrets:
  createcontroller: true

  serviceAccount:
    create: true
    name: sealed-secrets-controller

  secretName: "sealed-secrets-key"
  # Renew the sealing certificate every 30 days. Existing private keys remain
  # available to decrypt existing SealedSecrets during the transition.
  keyrenewperiod: "720h"

  podSecurityContext:
    enabled: true
    fsGroup: 65534

  containerSecurityContext:
    enabled: true
    readOnlyRootFilesystem: true
    runAsNonRoot: true
    runAsUser: 1001

  networkPolicy:
    enabled: false
