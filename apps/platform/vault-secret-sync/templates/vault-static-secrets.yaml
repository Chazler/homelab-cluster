{{- range $namespace, $config := .Values.namespaces }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault-secrets
  namespace: {{ $namespace }}
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultConnection
metadata:
  name: vault
  namespace: {{ $namespace }}
spec:
  address: http://vault.vault.svc:8200
  skipTLSVerify: true
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: vault-secrets
  namespace: {{ $namespace }}
spec:
  method: kubernetes
  mount: kubernetes
  vaultConnectionRef: vault
  kubernetes:
    role: vault-sync-{{ $namespace }}
    serviceAccount: vault-secrets
    audiences:
      - vault
{{- range $secretName, $secretConfig := $config.secrets }}
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: vault-sync-{{ $secretName }}
  namespace: {{ $namespace }}
spec:
  type: kv-v2
  mount: kv
  path: {{ $namespace }}/{{ $secretName }}
  refreshAfter: 1h
  hmacSecretData: true
  vaultAuthRef: vault-secrets
  destination:
    create: true
    name: {{ $secretName }}
    overwrite: true
    type: {{ default "Opaque" $secretConfig.type }}
{{- end }}
{{- end }}
