{{- range $namespace, $config := .Values.namespaces }}
{{- if $config.createNamespace }}
---
apiVersion: v1
kind: Namespace
metadata:
  name: {{ $namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  {{- with $config.namespaceLabels }}
  labels:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault-secrets
  namespace: {{ $namespace }}
---
apiVersion: v1
kind: Secret
metadata:
  name: vault-ca
  namespace: {{ $namespace }}
type: Opaque
stringData:
  ca.crt: {{ $.Values.caCertificate | quote }}
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultConnection
metadata:
  name: vault
  namespace: {{ $namespace }}
spec:
  address: https://vault.vault.svc:8200
  caCertSecretRef: vault-ca
  skipTLSVerify: false
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: vault-secrets
  namespace: {{ $namespace }}
spec:
  method: kubernetes
  mount: kubernetes
  vaultConnectionRef: vault
  kubernetes:
    role: vault-sync-{{ $namespace }}
    serviceAccount: vault-secrets
    audiences:
      - vault
{{- range $secretName, $secretConfig := $config.secrets }}
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: vault-sync-{{ $secretName }}
  namespace: {{ $namespace }}
spec:
  type: kv-v2
  mount: kv
  path: {{ default (printf "%s/%s" $namespace $secretName) $secretConfig.path }}
  refreshAfter: 1h
  hmacSecretData: true
  vaultAuthRef: vault-secrets
  destination:
    create: true
    name: {{ $secretName }}
    overwrite: true
    type: {{ default "Opaque" $secretConfig.type }}
    {{- with $secretConfig.labels }}
    labels:
{{ toYaml . | indent 6 }}
    {{- end }}
    {{- with $secretConfig.transformation }}
    transformation:
{{ toYaml . | indent 6 }}
    {{- end }}
  {{- with $secretConfig.rolloutRestartTargets }}
  rolloutRestartTargets:
{{ toYaml . | indent 4 }}
  {{- end }}
{{- end }}
{{- end }}
