namespaces:
  services:
    secrets:
      services-secrets: {}
      idea-triage-api-env: {}
      ghcr-image-pull-secret:
        type: kubernetes.io/dockerconfigjson
  jellyfin:
    secrets:
      jellystat-secrets: {}
  portfolio:
    secrets:
      ghcr-image-pull-secret:
        type: kubernetes.io/dockerconfigjson
  cert-manager:
    secrets:
      cloudflare-api-token: {}
  authentik:
    createNamespace: true
    secrets:
      authentik-runtime:
        path: authentik/runtime
        rolloutRestartTargets:
          - kind: Deployment
            name: authentik-server
          - kind: Deployment
            name: authentik-worker
        transformation:
          templates:
            AUTHENTIK_SECRET_KEY:
              text: '{{ get .Secrets "authentik-secret-key" }}'
            AUTHENTIK_POSTGRESQL__HOST:
              text: authentik-postgresql
            AUTHENTIK_POSTGRESQL__NAME:
              text: authentik
            AUTHENTIK_POSTGRESQL__PASSWORD:
              text: '{{ get .Secrets "postgres-password" }}'
            AUTHENTIK_POSTGRESQL__USER:
              text: authentik
            AUTHENTIK_BOOTSTRAP_TOKEN:
              text: '{{ get .Secrets "bootstrap-token" }}'
            password:
              text: '{{ get .Secrets "postgres-password" }}'
            postgres-password:
              text: '{{ get .Secrets "postgres-password" }}'
      authentik-google-oauth:
        path: authentik/google-oauth
        rolloutRestartTargets:
          - kind: Deployment
            name: authentik-server
          - kind: Deployment
            name: authentik-worker
        transformation:
          templates:
            AUTHENTIK_GOOGLE_CLIENT_ID:
              text: '{{ get .Secrets "client-id" }}'
            AUTHENTIK_GOOGLE_CLIENT_SECRET:
              text: '{{ get .Secrets "client-secret" }}'
  observability:
    createNamespace: true
    secrets:
      observability-grafana:
        path: observability/grafana
        transformation:
          templates:
            admin-user:
              text: '{{ get .Secrets "admin-user" }}'
            admin-password:
              text: '{{ get .Secrets "admin-password" }}'
      observability-alertmanager:
        path: observability/alertmanager
        transformation:
          templates:
            alertmanager.yaml:
              text: |
                global:
                  resolve_timeout: 5m
                route:
                  receiver: ntfy
                  group_by: [alertname, namespace]
                  group_wait: 30s
                  group_interval: 5m
                  repeat_interval: 4h
                receivers:
                  - name: ntfy
                    webhook_configs:
                      - url: http://alertmanager-ntfy.observability.svc:8000
                        send_resolved: true
                        http_config:
                          basic_auth:
                            username: '{{ get .Secrets "webhook-username" }}'
                            password: '{{ get .Secrets "webhook-password" }}'
      observability-alertmanager-ntfy:
        path: observability/alertmanager
        transformation:
          templates:
            config.yml:
              text: |
                http:
                  addr: :8000
                  auth:
                    username: '{{ get .Secrets "webhook-username" }}'
                    password: '{{ get .Secrets "webhook-password" }}'
                ntfy:
                  baseurl: http://ntfy.ntfy.svc
                  auth:
                    basic:
                      username: '{{ get .Secrets "alertmanager-username" }}'
                      password: '{{ get .Secrets "alertmanager-password" }}'
                  notification:
                    topic: alerts
                    priority: 'status == "firing" ? "high" : "default"'
                    tags:
                      - tag: rotating_light
                        condition: 'status == "firing"'
                      - tag: white_check_mark
                        condition: 'status == "resolved"'
                    templates:
                      title: '{{ "{{" }} if eq .Status "resolved" {{ "}}" }}Resolved: {{ "{{" }} end {{ "}}" }}{{ "{{" }} index .Annotations "summary" {{ "}}" }}'
                      description: '{{ "{{" }} index .Annotations "description" {{ "}}" }}'
                      headers:
                        X-Click: '{{ "{{" }} .GeneratorURL {{ "}}" }}'
  ntfy:
    createNamespace: true
    secrets:
      ntfy-runtime:
        path: ntfy/runtime
        transformation:
          templates:
            NTFY_AUTH_USERS:
              text: '{{ get .Secrets "auth-users" }}'
            NTFY_AUTH_ACCESS:
              text: '{{ get .Secrets "auth-access" }}'
