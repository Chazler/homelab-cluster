namespaces:
  services:
    secrets:
      services-secrets: {}
      idea-triage-api-env: {}
      openclaw-env: {}
      ghcr-image-pull-secret:
        type: kubernetes.io/dockerconfigjson
  jellyfin:
    secrets:
      jellystat-secrets: {}
  portfolio:
    secrets:
      ghcr-image-pull-secret:
        type: kubernetes.io/dockerconfigjson
  cert-manager:
    secrets:
      cloudflare-api-token: {}
  authentik:
    createNamespace: true
    secrets:
      authentik-runtime:
        path: authentik/runtime
        rolloutRestartTargets:
          - kind: Deployment
            name: authentik-server
          - kind: Deployment
            name: authentik-worker
        transformation:
          templates:
            AUTHENTIK_SECRET_KEY:
              text: '{{ get .Secrets "authentik-secret-key" }}'
            AUTHENTIK_POSTGRESQL__HOST:
              text: authentik-postgresql
            AUTHENTIK_POSTGRESQL__NAME:
              text: authentik
            AUTHENTIK_POSTGRESQL__PASSWORD:
              text: '{{ get .Secrets "postgres-password" }}'
            AUTHENTIK_POSTGRESQL__USER:
              text: authentik
            AUTHENTIK_BOOTSTRAP_TOKEN:
              text: '{{ get .Secrets "bootstrap-token" }}'
            password:
              text: '{{ get .Secrets "postgres-password" }}'
            postgres-password:
              text: '{{ get .Secrets "postgres-password" }}'
      authentik-google-oauth:
        path: authentik/google-oauth
        rolloutRestartTargets:
          - kind: Deployment
            name: authentik-server
          - kind: Deployment
            name: authentik-worker
        transformation:
          templates:
            AUTHENTIK_GOOGLE_CLIENT_ID:
              text: '{{ get .Secrets "client-id" }}'
            AUTHENTIK_GOOGLE_CLIENT_SECRET:
              text: '{{ get .Secrets "client-secret" }}'
      authentik-grafana-oauth:
        path: authentik/grafana-oauth
        rolloutRestartTargets:
          - kind: Deployment
            name: authentik-server
          - kind: Deployment
            name: authentik-worker
        transformation:
          templates:
            AUTHENTIK_GRAFANA_CLIENT_ID:
              text: '{{ get .Secrets "client-id" }}'
            AUTHENTIK_GRAFANA_CLIENT_SECRET:
              text: '{{ get .Secrets "client-secret" }}'
      authentik-vault-oauth:
        path: authentik/vault-oauth
        rolloutRestartTargets:
          - kind: Deployment
            name: authentik-server
          - kind: Deployment
            name: authentik-worker
        transformation:
          templates:
            AUTHENTIK_VAULT_CLIENT_ID:
              text: '{{ get .Secrets "client-id" }}'
            AUTHENTIK_VAULT_CLIENT_SECRET:
              text: '{{ get .Secrets "client-secret" }}'
      authentik-argocd-oauth:
        path: authentik/argocd-oauth
        rolloutRestartTargets:
          - kind: Deployment
            name: authentik-server
          - kind: Deployment
            name: authentik-worker
        transformation:
          templates:
            AUTHENTIK_ARGOCD_CLIENT_ID:
              text: '{{ get .Secrets "client-id" }}'
            AUTHENTIK_ARGOCD_CLIENT_SECRET:
              text: '{{ get .Secrets "client-secret" }}'
  argocd:
    secrets:
      argocd-oidc:
        path: argocd/oidc
        labels:
          app.kubernetes.io/part-of: argocd
        rolloutRestartTargets:
          - kind: Deployment
            name: argocd-server
        transformation:
          templates:
            client-id:
              text: '{{ get .Secrets "client-id" }}'
            client-secret:
              text: '{{ get .Secrets "client-secret" }}'
  observability:
    createNamespace: true
    secrets:
      observability-grafana:
        path: observability/grafana
        transformation:
          templates:
            admin-user:
              text: '{{ get .Secrets "admin-user" }}'
            admin-password:
              text: '{{ get .Secrets "admin-password" }}'
      observability-grafana-oauth:
        path: observability/grafana-oauth
        rolloutRestartTargets:
          - kind: StatefulSet
            name: observability-grafana
        transformation:
          templates:
            GF_AUTH_GENERIC_OAUTH_CLIENT_ID:
              text: '{{ get .Secrets "client-id" }}'
            GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET:
              text: '{{ get .Secrets "client-secret" }}'
      observability-alertmanager:
        path: observability/alertmanager
        transformation:
          templates:
            alertmanager.yaml:
              text: |
                global:
                  resolve_timeout: 5m
                route:
                  receiver: ntfy
                  group_by: [alertname, namespace]
                  group_wait: 30s
                  group_interval: 5m
                  repeat_interval: 4h
                receivers:
                  - name: ntfy
                    webhook_configs:
                      - url: http://alertmanager-ntfy.observability.svc:8080/alerts
                        send_resolved: true
                        http_config:
                          basic_auth:
                            username: '{{ get .Secrets "webhook-username" }}'
                            password: '{{ get .Secrets "webhook-password" }}'
            NTFY_USER:
              text: '{{ get .Secrets "alertmanager-username" }}'
            NTFY_PASSWORD:
              text: '{{ get .Secrets "alertmanager-password" }}'
  ntfy:
    secrets:
      ntfy-runtime:
        path: ntfy/runtime
        rolloutRestartTargets:
          - kind: Deployment
            name: ntfy
        transformation:
          templates:
            NTFY_AUTH_USERS:
              text: '{{ get .Secrets "auth-users" }}'
            NTFY_AUTH_ACCESS:
              text: '{{ get .Secrets "auth-access" }}'
