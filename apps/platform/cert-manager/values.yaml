cert-manager:
  crds:
    enabled: true
    keep: false

  global:
    logLevel: 1
    revisionHistoryLimit: 0
    leaderElection:
      namespace: cert-manager

  enableCertificateOwnerRef: true
  dns01RecursiveNameservers: 1.1.1.1:53,8.8.8.8:53
  extraArgs:
    - --enable-gateway-api
  prometheus:
    servicemonitor:
      enabled: true
