apiVersion: v1
kind: ConfigMap
metadata:
  name: authentik-argocd-provider
  namespace: {{ .Release.Namespace }}
data:
  argocd-provider.yaml: |
    version: 1
    metadata:
      name: Argo CD OAuth2 provider
    entries:
      - model: authentik_providers_oauth2.oauth2provider
        identifiers:
          name: argocd
        attrs:
          name: argocd
          client_type: confidential
          client_id: !Env AUTHENTIK_ARGOCD_CLIENT_ID
          client_secret: !Env AUTHENTIK_ARGOCD_CLIENT_SECRET
          grant_types:
            - authorization_code
            - refresh_token
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          signing_key: !Find [authentik_crypto.certificatekeypair, [name, "authentik Self-signed Certificate"]]
          property_mappings:
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, openid]]
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, email]]
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, profile]]
          redirect_uris:
            - matching_mode: strict
              url: https://argocd.joeriberman.nl/auth/callback
      - model: authentik_core.application
        identifiers:
          slug: argocd-oidc
        attrs:
          name: Argo CD
          slug: argocd-oidc
          provider: !Find [authentik_providers_oauth2.oauth2provider, [name, argocd]]
          meta_launch_url: https://argocd.joeriberman.nl
