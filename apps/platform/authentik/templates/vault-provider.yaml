apiVersion: v1
kind: ConfigMap
metadata:
  name: authentik-vault-provider
  namespace: {{ .Release.Namespace }}
data:
  vault-provider.yaml: |
    version: 1
    metadata:
      name: Vault OAuth2 provider
    entries:
      - model: authentik_providers_oauth2.oauth2provider
        identifiers:
          name: vault
        attrs:
          name: vault
          client_type: confidential
          client_id: !Env AUTHENTIK_VAULT_CLIENT_ID
          client_secret: !Env AUTHENTIK_VAULT_CLIENT_SECRET
          grant_types:
            - authorization_code
            - refresh_token
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          signing_key: !Find [authentik_crypto.certificatekeypair, [name, "authentik Self-signed Certificate"]]
          property_mappings:
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, openid]]
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, email]]
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, profile]]
          redirect_uris:
            - matching_mode: strict
              url: https://vault.joeriberman.nl/ui/vault/auth/oidc/oidc/callback
            - matching_mode: strict
              url: https://vault.joeriberman.nl/v1/auth/oidc/oidc/callback
            - matching_mode: strict
              url: http://localhost:8250/oidc/callback
      - model: authentik_core.application
        identifiers:
          slug: vault-oidc
        attrs:
          name: Vault
          slug: vault-oidc
          provider: !Find [authentik_providers_oauth2.oauth2provider, [name, vault]]
          meta_launch_url: https://vault.joeriberman.nl
