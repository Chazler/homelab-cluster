{{- $namespaces := list "argocd" "vault" "services" "jellyfin" "nextcloud" "vibe-trading" }}
{{- range $namespace := $namespaces }}
---
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: allow-{{ $namespace }}-forward-auth
  namespace: {{ $.Release.Namespace }}
spec:
  from:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      namespace: {{ $namespace }}
    - group: gateway.envoyproxy.io
      kind: SecurityPolicy
      namespace: {{ $namespace }}
  to:
    - group: ""
      kind: Service
      name: ak-outpost-homelab-forward-auth
{{- end }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: authentik-forward-auth
  namespace: {{ .Release.Namespace }}
  labels:
    goauthentik.io/blueprint: "true"
data:
  forward-auth.yaml: |
    version: 1
    metadata:
      name: Homelab forward-auth applications
    entries:
{{- $apps := list
  (dict "slug" "argocd" "name" "Argo CD" "hostname" "argocd.joeriberman.nl")
  (dict "slug" "vault" "name" "Vault" "hostname" "vault.joeriberman.nl")
  (dict "slug" "adguard" "name" "AdGuard Home" "hostname" "adguard.joeriberman.nl")
  (dict "slug" "umami" "name" "Umami" "hostname" "umami.joeriberman.nl")
  (dict "slug" "n8n" "name" "n8n" "hostname" "n8n.joeriberman.nl")
  (dict "slug" "idea-triage" "name" "Idea Triage" "hostname" "idea-triage.joeriberman.nl")
  (dict "slug" "jellystat" "name" "Jellystat" "hostname" "jellystat.joeriberman.nl")
  (dict "slug" "sonarr" "name" "Sonarr" "hostname" "sonarr.joeriberman.nl")
  (dict "slug" "sonarr-anime" "name" "Sonarr Anime" "hostname" "sonarr-anime.joeriberman.nl")
  (dict "slug" "radarr" "name" "Radarr" "hostname" "radarr.joeriberman.nl")
  (dict "slug" "prowlarr" "name" "Prowlarr" "hostname" "prowlarr.joeriberman.nl")
  (dict "slug" "bazarr" "name" "Bazarr" "hostname" "bazarr.joeriberman.nl")
  (dict "slug" "sabnzbd" "name" "SABnzbd" "hostname" "sabnzbd.joeriberman.nl")
  (dict "slug" "nextcloud" "name" "Nextcloud" "hostname" "nextcloud.joeriberman.nl")
  (dict "slug" "vibe-trading" "name" "Vibe-Trading" "hostname" "vibe-trading.joeriberman.nl")
}}
{{- range $app := $apps }}
      - model: authentik_providers_proxy.proxyprovider
        identifiers:
          name: forward-auth-{{ $app.slug }}
        attrs:
          name: forward-auth-{{ $app.slug }}
          external_host: https://{{ $app.hostname }}
          mode: forward_single
          intercept_header_auth: false
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      - model: authentik_core.application
        identifiers:
          slug: {{ $app.slug }}
        attrs:
          name: {{ $app.name }}
          slug: {{ $app.slug }}
          provider: !Find [authentik_providers_proxy.proxyprovider, [name, forward-auth-{{ $app.slug }}]]
          meta_launch_url: https://{{ $app.hostname }}
{{- end }}
      - model: authentik_outposts.outpost
        identifiers:
          name: homelab-forward-auth
        attrs:
          name: homelab-forward-auth
          type: proxy
          service_connection: !Find [authentik_outposts.kubernetesserviceconnection, [name, Local Kubernetes Cluster]]
          config:
            authentik_host: https://auth.joeriberman.nl
            kubernetes_namespace: authentik
            kubernetes_replicas: 1
            kubernetes_service_type: ClusterIP
            object_naming_template: ak-outpost-%(name)s
          providers:
{{- range $app := $apps }}
            - !Find [authentik_providers_proxy.proxyprovider, [name, forward-auth-{{ $app.slug }}]]
{{- end }}
