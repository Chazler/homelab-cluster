apiVersion: apps/v1
kind: Deployment
metadata:
  name: alertmanager-ntfy
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: alertmanager-ntfy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: alertmanager-ntfy
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: alertmanager-ntfy
          image: {{ .Values.alertmanagerNtfy.image }}
          args: [--configs=/etc/alertmanager-ntfy/config.yml]
          ports:
            - name: http
              containerPort: 8000
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: config
              mountPath: /etc/alertmanager-ntfy
              readOnly: true
      volumes:
        - name: config
          secret:
            secretName: observability-alertmanager-ntfy
---
apiVersion: v1
kind: Service
metadata:
  name: alertmanager-ntfy
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: alertmanager-ntfy
spec:
  selector:
    app.kubernetes.io/name: alertmanager-ntfy
  ports:
    - name: http
      port: 8000
      targetPort: http
