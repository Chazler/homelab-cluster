apiVersion: apps/v1
kind: Deployment
metadata:
  name: alertmanager-ntfy
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: alertmanager-ntfy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: alertmanager-ntfy
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: alertmanager-ntfy
          image: {{ .Values.alertmanagerNtfy.image }}
          env:
            - name: LISTEN_ADDRESS
              value: 0.0.0.0
            - name: LISTEN_PORT
              value: "8080"
            - name: NOTIFIER_TYPE
              value: ntfy
            - name: NTFY_URL
              value: http://ntfy.ntfy.svc
            - name: NTFY_TOPIC
              value: alerts
            - name: NTFY_DEFAULT_PRIORITY
              value: "3"
            - name: NTFY_USER
              valueFrom:
                secretKeyRef:
                  name: observability-alertmanager
                  key: NTFY_USER
            - name: NTFY_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: observability-alertmanager
                  key: NTFY_PASSWORD
          ports:
            - name: http
              containerPort: 8080
          livenessProbe:
            httpGet:
              path: /health
              port: http
          readinessProbe:
            httpGet:
              path: /health
              port: http
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            readOnlyRootFilesystem: true
---
apiVersion: v1
kind: Service
metadata:
  name: alertmanager-ntfy
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: alertmanager-ntfy
spec:
  selector:
    app.kubernetes.io/name: alertmanager-ntfy
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: alertmanager-ntfy
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: alertmanager-ntfy
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              alertmanager: monitoring-alertmanager
      ports:
        - protocol: TCP
          port: 8080
