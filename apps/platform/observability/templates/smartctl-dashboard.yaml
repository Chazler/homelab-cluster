apiVersion: v1
kind: ConfigMap
metadata:
  name: smartctl-disk-health-dashboard
  namespace: {{ .Values.nodeMetricsNamespace }}
  labels:
    grafana_dashboard: "1"
data:
  smartctl-disk-health.json: |
    {
      "title": "Disk Health",
      "uid": "smartctl-worker2-sdb",
      "tags": ["smart", "storage"],
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "5m",
      "time": { "from": "now-7d", "to": "now" },
      "panels": [
        {
          "id": 1,
          "type": "text",
          "title": "",
          "gridPos": { "h": 3, "w": 24, "x": 0, "y": 0 },
          "options": {
            "mode": "markdown",
            "content": "SMART health for every physical disk in the cluster (system NVMe/SSDs plus the two bulk-storage disks on `k8s-worker-2`). Longhorn/iSCSI virtual devices are excluded (`protocol` restricted to ATA/NVMe). `k8s-worker-2 sdb` (Seagate `ST4000DM005-2DP166`, serial `WDH2336K`) is currently failing — see homelab root `.tasks/07-rebuild-media-storage-with-22tb.md`."
          }
        },
        {
          "id": 2,
          "type": "stat",
          "title": "SMART Overall Health",
          "gridPos": { "h": 5, "w": 24, "x": 0, "y": 3 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "(smartctl_device_smart_status and on(pod,device) smartctl_device{protocol=~\"ATA|NVMe\"}) * on(pod) group_left(node) kube_pod_info{pod=~\"smartctl-exporter-.*\"}",
              "legendFormat": "{{ "{{" }}node{{ "}}" }} {{ "{{" }}device{{ "}}" }}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "mappings": [
                { "type": "value", "options": { "1": { "text": "PASSED", "color": "green" } } },
                { "type": "value", "options": { "0": { "text": "FAILED", "color": "red" } } }
              ],
              "thresholds": { "mode": "absolute", "steps": [{ "value": null, "color": "green" }] }
            }
          }
        },
        {
          "id": 3,
          "type": "stat",
          "title": "Current Temperature",
          "gridPos": { "h": 5, "w": 8, "x": 0, "y": 8 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "(smartctl_device_temperature{temperature_type=\"current\"} and on(pod,device) smartctl_device{protocol=~\"ATA|NVMe\"}) * on(pod) group_left(node) kube_pod_info{pod=~\"smartctl-exporter-.*\"}",
              "legendFormat": "{{ "{{" }}node{{ "}}" }} {{ "{{" }}device{{ "}}" }}"
            }
          ],
          "fieldConfig": { "defaults": { "unit": "celsius" } }
        },
        {
          "id": 4,
          "type": "stat",
          "title": "Current Pending Sector (ATA)",
          "description": "Sectors that failed to read and are awaiting reallocation. Nonzero means unreadable data exists right now.",
          "gridPos": { "h": 5, "w": 4, "x": 8, "y": 8 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "(smartctl_device_attribute{attribute_id=\"197\",attribute_value_type=\"raw\"} and on(pod,device) smartctl_device{protocol=\"ATA\"}) * on(pod) group_left(node) kube_pod_info{pod=~\"smartctl-exporter-.*\"}",
              "legendFormat": "{{ "{{" }}node{{ "}}" }} {{ "{{" }}device{{ "}}" }}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "value": null, "color": "green" },
                  { "value": 1, "color": "red" }
                ]
              }
            }
          }
        },
        {
          "id": 5,
          "type": "stat",
          "title": "Offline Uncorrectable (ATA)",
          "description": "Sectors that failed during an offline read verification and could not be corrected.",
          "gridPos": { "h": 5, "w": 4, "x": 12, "y": 8 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "(smartctl_device_attribute{attribute_id=\"198\",attribute_value_type=\"raw\"} and on(pod,device) smartctl_device{protocol=\"ATA\"}) * on(pod) group_left(node) kube_pod_info{pod=~\"smartctl-exporter-.*\"}",
              "legendFormat": "{{ "{{" }}node{{ "}}" }} {{ "{{" }}device{{ "}}" }}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "value": null, "color": "green" },
                  { "value": 1, "color": "red" }
                ]
              }
            }
          }
        },
        {
          "id": 6,
          "type": "stat",
          "title": "Reported Uncorrect (ATA)",
          "description": "Cumulative count of errors the drive could not correct and reported to the host.",
          "gridPos": { "h": 5, "w": 4, "x": 16, "y": 8 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "(smartctl_device_attribute{attribute_id=\"187\",attribute_value_type=\"raw\"} and on(pod,device) smartctl_device{protocol=\"ATA\"}) * on(pod) group_left(node) kube_pod_info{pod=~\"smartctl-exporter-.*\"}",
              "legendFormat": "{{ "{{" }}node{{ "}}" }} {{ "{{" }}device{{ "}}" }}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "value": null, "color": "green" },
                  { "value": 1, "color": "red" }
                ]
              }
            }
          }
        },
        {
          "id": 7,
          "type": "stat",
          "title": "Reallocated Sectors (ATA)",
          "description": "Sectors actually remapped to spares. Nonzero pending/offline-uncorrectable with 0 reallocated means bad sectors exist but haven't been rewritten yet.",
          "gridPos": { "h": 5, "w": 4, "x": 20, "y": 8 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "(smartctl_device_attribute{attribute_id=\"5\",attribute_value_type=\"raw\"} and on(pod,device) smartctl_device{protocol=\"ATA\"}) * on(pod) group_left(node) kube_pod_info{pod=~\"smartctl-exporter-.*\"}",
              "legendFormat": "{{ "{{" }}node{{ "}}" }} {{ "{{" }}device{{ "}}" }}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "value": null, "color": "green" },
                  { "value": 1, "color": "red" }
                ]
              }
            }
          }
        },
        {
          "id": 8,
          "type": "timeseries",
          "title": "Sector Error Counts Over Time (ATA disks)",
          "description": "The core decision-driving trend: pending/offline-uncorrectable/reported-uncorrect sectors climbing means active, worsening media degradation. NVMe disks use different health signals and aren't shown here.",
          "gridPos": { "h": 9, "w": 24, "x": 0, "y": 13 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "(smartctl_device_attribute{attribute_id=\"197\",attribute_value_type=\"raw\"} and on(pod,device) smartctl_device{protocol=\"ATA\"}) * on(pod) group_left(node) kube_pod_info{pod=~\"smartctl-exporter-.*\"}",
              "legendFormat": "{{ "{{" }}node{{ "}}" }} {{ "{{" }}device{{ "}}" }} - Current_Pending_Sector"
            },
            {
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "(smartctl_device_attribute{attribute_id=\"198\",attribute_value_type=\"raw\"} and on(pod,device) smartctl_device{protocol=\"ATA\"}) * on(pod) group_left(node) kube_pod_info{pod=~\"smartctl-exporter-.*\"}",
              "legendFormat": "{{ "{{" }}node{{ "}}" }} {{ "{{" }}device{{ "}}" }} - Offline_Uncorrectable"
            },
            {
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "(smartctl_device_attribute{attribute_id=\"187\",attribute_value_type=\"raw\"} and on(pod,device) smartctl_device{protocol=\"ATA\"}) * on(pod) group_left(node) kube_pod_info{pod=~\"smartctl-exporter-.*\"}",
              "legendFormat": "{{ "{{" }}node{{ "}}" }} {{ "{{" }}device{{ "}}" }} - Reported_Uncorrect"
            },
            {
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "(smartctl_device_attribute{attribute_id=\"5\",attribute_value_type=\"raw\"} and on(pod,device) smartctl_device{protocol=\"ATA\"}) * on(pod) group_left(node) kube_pod_info{pod=~\"smartctl-exporter-.*\"}",
              "legendFormat": "{{ "{{" }}node{{ "}}" }} {{ "{{" }}device{{ "}}" }} - Reallocated_Sector_Ct"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "custom": { "drawStyle": "line", "spanNulls": true, "fillOpacity": 0 },
              "min": 0
            }
          }
        },
        {
          "id": 9,
          "type": "timeseries",
          "title": "UDMA CRC Error Count (ATA disks)",
          "description": "Interface/cable errors. Should stay flat at 0; if one climbs, the cause may be that disk's SATA cable/connector, not its platters.",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 22 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "(smartctl_device_attribute{attribute_id=\"199\",attribute_value_type=\"raw\"} and on(pod,device) smartctl_device{protocol=\"ATA\"}) * on(pod) group_left(node) kube_pod_info{pod=~\"smartctl-exporter-.*\"}",
              "legendFormat": "{{ "{{" }}node{{ "}}" }} {{ "{{" }}device{{ "}}" }}"
            }
          ],
          "fieldConfig": { "defaults": { "min": 0 } }
        },
        {
          "id": 10,
          "type": "timeseries",
          "title": "Temperature Over Time",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 22 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "(smartctl_device_temperature{temperature_type=\"current\"} and on(pod,device) smartctl_device{protocol=~\"ATA|NVMe\"}) * on(pod) group_left(node) kube_pod_info{pod=~\"smartctl-exporter-.*\"}",
              "legendFormat": "{{ "{{" }}node{{ "}}" }} {{ "{{" }}device{{ "}}" }}"
            }
          ],
          "fieldConfig": { "defaults": { "unit": "celsius", "min": 0 } }
        }
      ]
    }
