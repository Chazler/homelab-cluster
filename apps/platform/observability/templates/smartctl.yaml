apiVersion: v1
kind: ServiceAccount
metadata:
  name: smartctl-exporter
  namespace: {{ .Values.nodeMetricsNamespace }}
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: smartctl-exporter
  namespace: {{ .Values.nodeMetricsNamespace }}
  labels:
    app.kubernetes.io/name: smartctl-exporter
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: smartctl-exporter
  template:
    metadata:
      labels:
        app.kubernetes.io/name: smartctl-exporter
    spec:
      serviceAccountName: smartctl-exporter
      containers:
        - name: smartctl-exporter
          image: quay.io/prometheuscommunity/smartctl-exporter:v0.14.0
          args:
            - --smartctl.path=/usr/sbin/smartctl
            - --smartctl.interval=120s
            - --smartctl.device-exclude=/dev/loop.*
            - --web.listen-address=:9633
          ports:
            - name: metrics
              containerPort: 9633
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              memory: 128Mi
          securityContext:
            # SMART ioctls require privileged device access. The only host mount
            # is /dev and it is read-only; the pod has no API credentials.
            privileged: true
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: host-dev
              mountPath: /hostdev
              readOnly: true
      volumes:
        - name: host-dev
          hostPath:
            path: /dev
            type: Directory
      tolerations:
        - operator: Exists
          effect: NoSchedule
---
apiVersion: v1
kind: Service
metadata:
  name: smartctl-exporter
  namespace: {{ .Values.nodeMetricsNamespace }}
  labels:
    app.kubernetes.io/name: smartctl-exporter
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: smartctl-exporter
  ports:
    - name: metrics
      port: 9633
      targetPort: metrics
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: smartctl-exporter
  namespace: {{ .Values.nodeMetricsNamespace }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: smartctl-exporter
  endpoints:
    - port: metrics
      interval: 60s
      scrapeTimeout: 30s
  attachMetadata:
    node: true
