kube-prometheus-stack:
  fullnameOverride: monitoring

  defaultRules:
    create: true

  # Talos does not expose these control-plane metrics on node IPs.
  kubeControllerManager:
    enabled: false
  kubeScheduler:
    enabled: false
  # Cilium runs in kube-proxy replacement mode; no kube-proxy exists to scrape.
  kubeProxy:
    enabled: false

  prometheus-node-exporter:
    namespaceOverride: node-observability

  grafana:
    admin:
      existingSecret: observability-grafana
      userKey: admin-user
      passwordKey: admin-password
    envFromSecret: observability-grafana-oauth
    grafana.ini:
      server:
        root_url: https://grafana.joeriberman.nl
      auth:
        disable_login_form: false
        oauth_auto_login: false
      auth.generic_oauth:
        enabled: true
        name: authentik
        scopes: openid profile email
        auth_url: https://auth.joeriberman.nl/application/o/authorize/
        token_url: https://auth.joeriberman.nl/application/o/token/
        api_url: https://auth.joeriberman.nl/application/o/userinfo/
        redirect_uri: https://grafana.joeriberman.nl/login/generic_oauth
        use_pkce: true
        allow_sign_up: true
        role_attribute_path: "'Admin'"
    persistence:
      enabled: true
      type: sts
      storageClassName: observability-rwo
      accessModes:
        - ReadWriteOnce
      size: 2Gi
    resources:
      requests:
        cpu: 50m
        memory: 192Mi
      limits:
        memory: 384Mi

  alertmanager:
    alertmanagerSpec:
      replicas: 1
      configSecret: observability-alertmanager
      storage:
        volumeClaimTemplate:
          spec:
            storageClassName: observability-rwo
            accessModes:
              - ReadWriteOnce
            resources:
              requests:
                storage: 2Gi
      resources:
        requests:
          cpu: 25m
          memory: 64Mi
        limits:
          memory: 128Mi

  prometheus:
    prometheusSpec:
      replicas: 1
      scrapeInterval: 60s
      evaluationInterval: 60s
      retention: 10d
      # Leave capacity for WAL and compaction while keeping all metric data below 25 GiB.
      retentionSize: 20GiB
      serviceMonitorSelectorNilUsesHelmValues: false
      serviceMonitorSelector: {}
      podMonitorSelectorNilUsesHelmValues: false
      podMonitorSelector: {}
      ruleSelectorNilUsesHelmValues: false
      ruleSelector: {}
      storageSpec:
        volumeClaimTemplate:
          spec:
            storageClassName: observability-rwo
            accessModes:
              - ReadWriteOnce
            resources:
              requests:
                storage: 25Gi
      resources:
        requests:
          cpu: 250m
          memory: 1Gi
        limits:
          memory: 2Gi

alertmanagerNtfy:
  image: docker.io/davidcasado/alertmanager-notifier@sha256:ea7502c80bc1fabe4f196ef03d9a63324ecb517ca8915e1f66032fa683296040

route:
  parentGateway:
    group: gateway.networking.k8s.io
    kind: Gateway
    name: envoy-gateway
    namespace: envoy-gateway
    sectionName: web-https

nodeMetricsNamespace: node-observability
