apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: envoy-gateway
  namespace: envoy-gateway
  annotations:
    cert-manager.io/revision-history-limit: "1"
    cert-manager.io/cluster-issuer: letsencrypt-dns
spec:
  gatewayClassName: envoy-gateway
  addresses:
    - type: IPAddress
      value: 10.0.0.242
  listeners:
    # HTTPS Termination for the apex domain joeriberman.nl (wildcard does NOT match apex)
    - name: web-https-apex
      protocol: HTTPS
      port: 443
      hostname: "joeriberman.nl"
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchExpressions:
              - key: kubernetes.io/metadata.name
                operator: In
                values:
                  - argocd
                  - authentik
                  - homeassistant
                  - jellyfin
                  - ntfy
                  - observability
                  - portfolio
                  - services
                  - vault
      tls:
        mode: Terminate
        certificateRefs:
          - group: ""
            kind: Secret
            name: apex-tls

    # HTTPS Termination for *.joeriberman.nl
    - name: web-https
      protocol: HTTPS
      port: 443
      hostname: "*.joeriberman.nl"
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchExpressions:
              - key: kubernetes.io/metadata.name
                operator: In
                values:
                  - argocd
                  - authentik
                  - homeassistant
                  - jellyfin
                  - ntfy
                  - observability
                  - portfolio
                  - services
                  - vault
      tls:
        mode: Terminate
        certificateRefs:
          - group: ""
            kind: Secret
            name: wildcard-tls
