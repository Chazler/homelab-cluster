{{- if .Values.policies.authentikForwardAuth.enabled }}
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: generate-authentik-forward-auth
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    - name: generate-forward-auth-securitypolicy
      match:
        any:
          - resources:
              kinds:
                - gateway.networking.k8s.io/v1/HTTPRoute
              selector:
                matchLabels:
                  {{ .Values.policies.authentikForwardAuth.labelKey }}: {{ .Values.policies.authentikForwardAuth.labelValue | quote }}
      skipBackgroundRequests: false
      generate:
        apiVersion: gateway.envoyproxy.io/v1alpha1
        kind: SecurityPolicy
        name: authentik-forward-auth-{{ "{{request.object.metadata.name}}" }}
        namespace: {{ "{{request.object.metadata.namespace}}" | quote }}
        synchronize: true
        generateExisting: true
        data:
          apiVersion: gateway.envoyproxy.io/v1alpha1
          kind: SecurityPolicy
          metadata:
            name: authentik-forward-auth-{{ "{{request.object.metadata.name}}" }}
            namespace: {{ "{{request.object.metadata.namespace}}" | quote }}
          spec:
            targetRefs:
              - group: gateway.networking.k8s.io
                kind: HTTPRoute
                name: {{ "{{request.object.metadata.name}}" | quote }}
            extAuth:
              failOpen: false
              headersToExtAuth:
                - cookie
                - x-forwarded-host
                - x-forwarded-proto
                - x-forwarded-uri
              http:
                backendRefs:
                  - group: ""
                    kind: Service
                    name: {{ required "policies.authentikForwardAuth.authentikServiceName is required when enabled" .Values.policies.authentikForwardAuth.authentikServiceName | quote }}
                    namespace: {{ required "policies.authentikForwardAuth.authentikNamespace is required when enabled" .Values.policies.authentikForwardAuth.authentikNamespace | quote }}
                    port: {{ required "policies.authentikForwardAuth.authentikServicePort is required when enabled" .Values.policies.authentikForwardAuth.authentikServicePort }}
                path: /outpost.goauthentik.io/auth/envoy
                headersToBackend:
                  - x-authentik-username
                  - x-authentik-groups
                  - x-authentik-entitlements
                  - x-authentik-email
                  - x-authentik-name
                  - x-authentik-uid
    - name: generate-outpost-route
      match:
        any:
          - resources:
              kinds:
                - gateway.networking.k8s.io/v1/HTTPRoute
              selector:
                matchLabels:
                  {{ .Values.policies.authentikForwardAuth.labelKey }}: {{ .Values.policies.authentikForwardAuth.labelValue | quote }}
      skipBackgroundRequests: false
      generate:
        apiVersion: gateway.networking.k8s.io/v1
        kind: HTTPRoute
        name: authentik-outpost-{{ "{{request.object.metadata.name}}" }}
        namespace: {{ "{{request.object.metadata.namespace}}" | quote }}
        synchronize: true
        generateExisting: true
        data:
          apiVersion: gateway.networking.k8s.io/v1
          kind: HTTPRoute
          metadata:
            name: authentik-outpost-{{ "{{request.object.metadata.name}}" }}
            namespace: {{ "{{request.object.metadata.namespace}}" | quote }}
          spec:
            parentRefs:
              - group: {{ "{{request.object.spec.parentRefs[0].group}}" | quote }}
                kind: {{ "{{request.object.spec.parentRefs[0].kind}}" | quote }}
                name: {{ "{{request.object.spec.parentRefs[0].name}}" | quote }}
                namespace: {{ "{{request.object.spec.parentRefs[0].namespace}}" | quote }}
                sectionName: {{ "{{request.object.spec.parentRefs[0].sectionName}}" | quote }}
            hostnames:
              - {{ "{{request.object.spec.hostnames[0]}}" | quote }}
            rules:
              - matches:
                  - path:
                      type: PathPrefix
                      value: /outpost.goauthentik.io
                backendRefs:
                  - group: ""
                    kind: Service
                    name: {{ required "policies.authentikForwardAuth.authentikServiceName is required when enabled" .Values.policies.authentikForwardAuth.authentikServiceName | quote }}
                    namespace: {{ required "policies.authentikForwardAuth.authentikNamespace is required when enabled" .Values.policies.authentikForwardAuth.authentikNamespace | quote }}
                    port: {{ required "policies.authentikForwardAuth.authentikServicePort is required when enabled" .Values.policies.authentikForwardAuth.authentikServicePort }}
{{- end }}
