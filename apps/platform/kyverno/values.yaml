kyverno:
  fullnameOverride: kyverno

  admissionController:
    rbac:
      clusterRole:
        extraResources:
          - apiGroups:
              - gateway.envoyproxy.io
            resources:
              - securitypolicies
            verbs:
              - get
              - list
              - watch
              - create
              - update
              - patch
              - delete
          - apiGroups:
              - gateway.networking.k8s.io
            resources:
              - httproutes
            verbs:
              - get
              - list
              - watch

  backgroundController:
    rbac:
      clusterRole:
        extraResources:
          - apiGroups:
              - gateway.envoyproxy.io
            resources:
              - securitypolicies
            verbs:
              - get
              - list
              - watch
              - create
              - update
              - patch
              - delete
          - apiGroups:
              - gateway.networking.k8s.io
            resources:
              - httproutes
            verbs:
              - get
              - list
              - watch

policies:
  authentikForwardAuth:
    enabled: true
    # HTTPRoutes with this label receive an Authentik external-auth policy and
    # a public route for the provider's outpost endpoints.
    labelKey: authentik-forward-auth
    labelValue: "true"
    authentikNamespace: authentik
    authentikServiceName: authentik-server
    authentikServicePort: 80
