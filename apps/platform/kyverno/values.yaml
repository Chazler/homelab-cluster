kyverno:
  fullnameOverride: kyverno

  kyverno-api:
    labels:
      app.kubernetes.io/managed-by: argocd
    annotations:
      app.kubernetes.io/managed-by: argocd

  admissionController:
    rbac:
      clusterRole:
        extraResources:
          - apiGroups:
              - gateway.networking.k8s.io
            resources:
              - httproutes
            verbs:
              - get
              - list
              - watch
          - apiGroups:
              - gateway.networking.k8s.io
            resources:
              - referencegrants
            verbs:
              - get
              - list
              - watch
              - create
              - update
              - patch
              - delete
          - apiGroups:
              - gateway.envoyproxy.io
            resources:
              - securitypolicies
            verbs:
              - get
              - list
              - watch
              - create
              - update
              - patch
              - delete

  backgroundController:
    rbac:
      clusterRole:
        extraResources:
          - apiGroups:
              - gateway.networking.k8s.io
            resources:
              - httproutes
            verbs:
              - get
              - list
              - watch
          - apiGroups:
              - gateway.networking.k8s.io
            resources:
              - referencegrants
            verbs:
              - get
              - list
              - watch
              - create
              - update
              - patch
              - delete
          - apiGroups:
              - gateway.envoyproxy.io
            resources:
              - securitypolicies
            verbs:
              - get
              - list
              - watch
              - create
              - update
              - patch
              - delete

policies:
  authentikForwardAuth:
    enabled: true
    # HTTPRoutes with this label receive an Authentik external-auth policy and
    # a public route for the provider's outpost endpoints.
    labelKey: authentik-forward-auth
    labelValue: "true"
    # Namespaces carrying this label get a ReferenceGrant generated into
    # authentikNamespace, allowing their HTTPRoutes/SecurityPolicies to
    # reference the outpost Service.
    namespaceLabelKey: authentik-forward-auth-namespace
    namespaceLabelValue: "true"
    authentikNamespace: authentik
    authentikServiceName: ak-outpost-homelab-forward-auth
    authentikServicePort: 9000
