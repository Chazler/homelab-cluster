route:
  enabled: true
  hostname: vault.joeriberman.nl
  labels:
    authentik-forward-auth: "true"
  parentGateway:
    group: gateway.networking.k8s.io
    kind: Gateway
    name: envoy-gateway
    namespace: envoy-gateway
    sectionName: web-https
  backend:
    group: ''
    kind: Service
    serviceName: vault-ui
    port: 8200
    weight: 1
