vault:
  global:
    tlsDisable: false

  server:
    ha:
      enabled: true
      replicas: 3
      raft:
        enabled: true
        setNodeId: true
        config: |
          ui = true
          disable_mlock = true

          listener "tcp" {
            address = "[::]:8200"
            cluster_address = "[::]:8201"
            tls_cert_file = "/vault/userconfig/vault-server-tls/tls.crt"
            tls_key_file = "/vault/userconfig/vault-server-tls/tls.key"
          }

          storage "raft" {
            path = "/vault/data"

            retry_join {
              leader_api_addr = "https://vault-0.vault-internal:8200"
              leader_ca_cert_file = "/vault/userconfig/vault-server-tls/ca.crt"
            }

            retry_join {
              leader_api_addr = "https://vault-1.vault-internal:8200"
              leader_ca_cert_file = "/vault/userconfig/vault-server-tls/ca.crt"
            }
          }

          service_registration "kubernetes" {}

          # The credentials file is a SealedSecret so the GCP service-account
          # key remains encrypted in Git.
          seal "gcpckms" {
            project     = "festive-flame-505120-b4"
            region      = "europe-west4"
            key_ring    = "vault-auto-unseal"
            crypto_key  = "vault-auto-unseal"
          }

    extraEnvironmentVars:
      GOOGLE_APPLICATION_CREDENTIALS: /vault/userconfig/gcp/vault-auto-unseal-gcp/credentials.json

    extraVolumes:
      - type: secret
        name: vault-auto-unseal-gcp
        path: /vault/userconfig/gcp
      - type: secret
        name: vault-server-tls

    dataStorage:
      enabled: true
      size: 2Gi
      storageClass: platform-rwo
    
    affinity:
      podAntiAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchLabels:
                app.kubernetes.io/name: vault
            topologyKey: kubernetes.io/hostname

  ui:
    enabled: true

  injector:
    enabled: true

