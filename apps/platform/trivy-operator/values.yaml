trivy-operator:
  # Bounded resource requests/limits for the operator's own controller pod.
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 768Mi

  serviceMonitor:
    enabled: true

  operator:
    # Vulnerability, exposed-secret, RBAC, infra-assessment, and
    # cluster-compliance scanners (config-audit is on by default too).
    vulnerabilityScannerEnabled: true
    exposedSecretScannerEnabled: true
    rbacAssessmentScannerEnabled: true
    infraAssessmentScannerEnabled: true
    clusterComplianceEnabled: true
    configAuditScannerEnabled: true

    # Reports are stored as in-cluster CRs only; nothing is exported.
    webhookBroadcastURL: ""

    # Cap how many scan jobs run at once and how long stale reports live.
    scanJobsConcurrentLimit: 5
    scannerReportTTL: "24h"

  # Talos has no systemd, so /etc/systemd and /lib/systemd don't exist on the
  # host and its read-only root blocks kubelet from creating them for a
  # hostPath mount. Drop those two mounts from the chart's default list;
  # keep the rest, which map to paths Talos does populate.
  nodeCollector:
    volumeMounts:
      - name: var-lib-etcd
        mountPath: /var/lib/etcd
        readOnly: true
      - name: var-lib-kubelet
        mountPath: /var/lib/kubelet
        readOnly: true
      - name: var-lib-kube-scheduler
        mountPath: /var/lib/kube-scheduler
        readOnly: true
      - name: var-lib-kube-controller-manager
        mountPath: /var/lib/kube-controller-manager
        readOnly: true
      - name: etc-kubernetes
        mountPath: /etc/kubernetes
        readOnly: true
      - name: etc-cni-netd
        mountPath: /etc/cni/net.d/
        readOnly: true
    volumes:
      - name: var-lib-etcd
        hostPath:
          path: /var/lib/etcd
      - name: var-lib-kubelet
        hostPath:
          path: /var/lib/kubelet
      - name: var-lib-kube-scheduler
        hostPath:
          path: /var/lib/kube-scheduler
      - name: var-lib-kube-controller-manager
        hostPath:
          path: /var/lib/kube-controller-manager
      - name: etc-kubernetes
        hostPath:
          path: /etc/kubernetes
      - name: etc-cni-netd
        hostPath:
          path: /etc/cni/net.d/
