apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: trivy-server
  namespace: trivy-operator
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: trivy-server
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector: {}
      ports:
        - protocol: TCP
          port: 4954
