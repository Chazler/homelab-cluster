apiVersion: v1
kind: ConfigMap
metadata:
  name: trivy-operator-dashboard
  namespace: trivy-operator
  labels:
    grafana_dashboard: "1"
  annotations:
    argocd.argoproj.io/sync-options: ServerSideApply=true
data:
  trivy-operator-dashboard.json: |
    {{- .Files.Get "files/trivy-operator-dashboard.json" | nindent 4 }}
