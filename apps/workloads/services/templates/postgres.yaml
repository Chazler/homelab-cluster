apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
  namespace: {{ .Release.Namespace }}
data:
  01-create-application-databases.sh: |
    #!/bin/sh
    set -eu
    psql --set=ON_ERROR_STOP=1 \
      --set=umami_password="$UMAMI_DB_PASSWORD" \
      --set=idea_password="$IDEA_DB_PASSWORD" \
      --username "$POSTGRES_USER" --dbname postgres <<'SQL'
    CREATE ROLE joeri LOGIN PASSWORD :'umami_password';
    CREATE DATABASE umami OWNER joeri;
    CREATE ROLE idea_triage LOGIN PASSWORD :'idea_password';
    CREATE DATABASE idea_triage OWNER idea_triage;
    SQL
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: postgres
    {{- include "services.labels" . | nindent 4 }}
spec:
  serviceName: postgres
  replicas: 1
  revisionHistoryLimit: {{ .Values.revisionHistoryLimit }}
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
        app.kubernetes.io/part-of: services
    spec:
      securityContext:
        fsGroup: 999
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: postgres
          image: {{ .Values.postgres.image | quote }}
          imagePullPolicy: IfNotPresent
          env:
            - name: POSTGRES_USER
              value: postgres
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: services-secrets
                  key: POSTGRES_ADMIN_PASSWORD
            - name: UMAMI_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: services-secrets
                  key: UMAMI_DB_PASSWORD
            - name: IDEA_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: services-secrets
                  key: IDEA_DB_PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - name: postgres
              containerPort: 5432
          startupProbe:
            exec:
              command: ["pg_isready", "-U", "postgres"]
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres"]
            periodSeconds: 10
          resources:
            {{- toYaml .Values.postgres.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: init
              mountPath: /docker-entrypoint-initdb.d
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: services-postgres-data
        - name: init
          configMap:
            name: postgres-init
            defaultMode: 0555
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    app.kubernetes.io/name: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
