apiVersion: apps/v1
kind: Deployment
metadata:
  name: adguard
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: adguard
    {{- include "services.labels" . | nindent 4 }}
spec:
  replicas: 1
  revisionHistoryLimit: {{ .Values.revisionHistoryLimit }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: adguard
  template:
    metadata:
      labels:
        app.kubernetes.io/name: adguard
        app.kubernetes.io/part-of: services
    spec:
      containers:
        - name: adguard
          image: {{ .Values.adguard.image | quote }}
          imagePullPolicy: IfNotPresent
          env:
            - name: TZ
              value: Europe/Amsterdam
          ports:
            - name: http
              containerPort: 80
            - name: dns-tcp
              containerPort: 53
              protocol: TCP
            - name: dns-udp
              containerPort: 53
              protocol: UDP
          startupProbe:
            tcpSocket:
              port: http
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
          resources:
            {{- toYaml .Values.adguard.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /opt/adguardhome/work
              subPath: work
            - name: data
              mountPath: /opt/adguardhome/conf
              subPath: conf
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: adguard-data
---
apiVersion: v1
kind: Service
metadata:
  name: adguard
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    app.kubernetes.io/name: adguard
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: adguard-dns
  namespace: {{ .Release.Namespace }}
  annotations:
    io.cilium/lb-ipam-ips: {{ .Values.adguard.dnsAddress | quote }}
spec:
  type: LoadBalancer
  selector:
    app.kubernetes.io/name: adguard
  ports:
    - name: dns-tcp
      port: 53
      targetPort: dns-tcp
      protocol: TCP
    - name: dns-udp
      port: 53
      targetPort: dns-udp
      protocol: UDP
