{{- $routes := list
  (dict "name" "adguard" "hostname" .Values.adguard.hostname)
  (dict "name" "umami" "hostname" .Values.umami.hostname)
  (dict "name" "n8n" "hostname" .Values.n8n.hostname)
  (dict "name" "idea-triage" "hostname" .Values.ideaTriage.hostname)
}}
{{- range $route := $routes }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: authentik-outpost-{{ $route.name }}
  namespace: {{ $.Release.Namespace }}
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: {{ $.Values.gateway.name }}
      namespace: {{ $.Values.gateway.namespace }}
      sectionName: {{ $.Values.gateway.sectionName }}
  hostnames:
    - {{ $route.hostname | quote }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /outpost.goauthentik.io
      backendRefs:
        - group: ""
          kind: Service
          name: ak-outpost-homelab-forward-auth
          namespace: authentik
          port: 9000
          weight: 1
---
{{- end }}
