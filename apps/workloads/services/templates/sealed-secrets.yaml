apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: services-secrets
  namespace: services
spec:
  encryptedData:
    IDEA_DB_PASSWORD: 
    POSTGRES_ADMIN_PASSWORD: 
    SUPABASE_ANON_KEY: 
    SUPABASE_URL: 
    UMAMI_APP_SECRET: 
    UMAMI_DATABASE_URL: 
    UMAMI_DB_PASSWORD: 
  template:
    metadata:
      name: services-secrets
      namespace: services
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: idea-triage-api-env
  namespace: services
spec:
  encryptedData:
    DATABASE_URL: 
    EXPORT_ROOT: 
    LOG_LEVEL: 
    OPENROUTER_API_KEY: 
    OPENROUTER_APP_NAME: 
    OPENROUTER_MODEL: 
    OPENROUTER_SITE_URL: 
    TELEGRAM_ALLOWED_USER_ID: 
    TELEGRAM_BOT_TOKEN: 
  template:
    metadata:
      name: idea-triage-api-env
      namespace: services
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: ghcr-image-pull-secret
  namespace: services
spec:
  encryptedData:
    .dockerconfigjson: 
  template:
    metadata:
      name: ghcr-image-pull-secret
      namespace: services
    type: kubernetes.io/dockerconfigjson
