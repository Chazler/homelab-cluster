{{- $publicRoutes := list
  (dict "name" "polylearn" "requests" 120)
  (dict "name" "openclaw" "requests" 300)
-}}
{{- range $route := $publicRoutes }}
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: {{ $route.name }}-rate-limit
  namespace: {{ $.Release.Namespace }}
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: {{ $route.name }}
  rateLimit:
    type: Local
    local:
      # Per-Envoy-replica counters (no shared global store), so the effective
      # ceiling per client is roughly limit * replica count.
      rules:
        - clientSelectors:
            - sourceCIDR:
                invert: false
                type: Distinct
                value: 0.0.0.0/0
          limit:
            requests: {{ $route.requests }}
            unit: Minute
        - clientSelectors:
            - sourceCIDR:
                invert: false
                type: Distinct
                value: ::/0
          limit:
            requests: {{ $route.requests }}
            unit: Minute
---
{{- end }}
