apiVersion: apps/v1
kind: Deployment
metadata:
  name: idea-triage-api
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: idea-triage-api
    {{- include "services.labels" . | nindent 4 }}
spec:
  replicas: 1
  revisionHistoryLimit: {{ .Values.revisionHistoryLimit }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: idea-triage-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: idea-triage-api
        app.kubernetes.io/part-of: services
    spec:
      imagePullSecrets:
        - name: {{ .Values.imagePullSecret }}
      containers:
        - name: api
          image: {{ .Values.ideaTriage.apiImage | quote }}
          imagePullPolicy: IfNotPresent
          envFrom:
            - secretRef:
                name: idea-triage-api-env
          env:
            - name: APP_ENV
              value: production
            - name: TZ
              value: Europe/Amsterdam
          ports:
            - name: http
              containerPort: 8000
          startupProbe:
            httpGet:
              path: /api/health
              port: http
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 10
          resources:
            {{- toYaml .Values.ideaTriage.resources.api | nindent 12 }}
          volumeMounts:
            - name: exports
              mountPath: /app/exports
      volumes:
        - name: exports
          persistentVolumeClaim:
            claimName: idea-triage-exports
---
apiVersion: v1
kind: Service
metadata:
  name: idea-triage-api
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    app.kubernetes.io/name: idea-triage-api
  ports:
    - name: http
      port: 8000
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: idea-triage-frontend
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: idea-triage-frontend
    {{- include "services.labels" . | nindent 4 }}
spec:
  replicas: 1
  revisionHistoryLimit: {{ .Values.revisionHistoryLimit }}
  selector:
    matchLabels:
      app.kubernetes.io/name: idea-triage-frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: idea-triage-frontend
        app.kubernetes.io/part-of: services
    spec:
      imagePullSecrets:
        - name: {{ .Values.imagePullSecret }}
      containers:
        - name: frontend
          image: {{ .Values.ideaTriage.frontendImage | quote }}
          imagePullPolicy: IfNotPresent
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: TZ
              value: Europe/Amsterdam
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
          resources:
            {{- toYaml .Values.ideaTriage.resources.frontend | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: idea-triage-frontend
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    app.kubernetes.io/name: idea-triage-frontend
  ports:
    - name: http
      port: 80
      targetPort: http
