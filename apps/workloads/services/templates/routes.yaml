{{- /* openclaw has forwardAuth false on purpose: its gateway authenticates
       natively via gateway.auth.mode=token so the iOS app can pair. A native
       client cannot complete Authentik's browser SSO redirect, and
       trusted-proxy mode is mutually exclusive with a shared token. */}}
{{- $routes := list
  (dict "name" "adguard" "hostname" .Values.adguard.hostname "service" "adguard" "port" 80 "forwardAuth" true)
  (dict "name" "umami" "hostname" .Values.umami.hostname "service" "umami" "port" 3000 "forwardAuth" true)
  (dict "name" "polylearn" "hostname" .Values.polylearn.hostname "service" "polylearn" "port" 80 "forwardAuth" false)
  (dict "name" "openclaw" "hostname" .Values.openclaw.hostname "service" "openclaw" "port" 18789 "forwardAuth" false)
-}}
{{- /* n8n editor UI stays behind Authentik forward-auth, but webhook and MCP
       server endpoints are called by external services/clients that can't
       complete a browser SSO redirect, so they get their own unauthenticated
       route. Each n8n Webhook/MCP Server Trigger node must set its own
       auth (header/bearer) since it bypasses the Authentik gate. The
       /mcp-oauth and /.well-known/oauth-* paths are n8n's own native OAuth2
       authorization server for MCP clients (discovery, DCR, authorize,
       token) and must stay public for that flow to work — auth there is
       n8n's own login, not Authentik's. */}}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: n8n-public
  namespace: {{ .Release.Namespace }}
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: {{ .Values.gateway.name }}
      namespace: {{ .Values.gateway.namespace }}
      sectionName: {{ .Values.gateway.sectionName }}
  hostnames:
    - {{ .Values.n8n.hostname | quote }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /webhook
        - path:
            type: PathPrefix
            value: /webhook-waiting
        - path:
            type: PathPrefix
            value: /mcp-server
        - path:
            type: PathPrefix
            value: /mcp-oauth
        - path:
            type: PathPrefix
            value: /.well-known/oauth-protected-resource
        - path:
            type: PathPrefix
            value: /.well-known/oauth-authorization-server
      backendRefs:
        - group: ""
          kind: Service
          name: n8n
          port: 5678
          weight: 1
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: n8n
  namespace: {{ .Release.Namespace }}
  labels:
    authentik-forward-auth: "true"
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: {{ .Values.gateway.name }}
      namespace: {{ .Values.gateway.namespace }}
      sectionName: {{ .Values.gateway.sectionName }}
  hostnames:
    - {{ .Values.n8n.hostname | quote }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: ""
          kind: Service
          name: n8n
          port: 5678
          weight: 1
---
{{- range $route := $routes }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $route.name }}
  namespace: {{ $.Release.Namespace }}
  {{- if $route.forwardAuth }}
  labels:
    authentik-forward-auth: "true"
  {{- end }}
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: {{ $.Values.gateway.name }}
      namespace: {{ $.Values.gateway.namespace }}
      sectionName: {{ $.Values.gateway.sectionName }}
  hostnames:
    - {{ $route.hostname | quote }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: ""
          kind: Service
          name: {{ $route.service }}
          port: {{ $route.port }}
          weight: 1
---
{{- end }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: idea-triage
  namespace: {{ .Release.Namespace }}
  labels:
    authentik-forward-auth: "true"
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: {{ .Values.gateway.name }}
      namespace: {{ .Values.gateway.namespace }}
      sectionName: {{ .Values.gateway.sectionName }}
  hostnames:
    - {{ .Values.ideaTriage.hostname | quote }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api
      backendRefs:
        - group: ""
          kind: Service
          name: idea-triage-api
          port: 8000
          weight: 1
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: ""
          kind: Service
          name: idea-triage-frontend
          port: 80
          weight: 1
