{{- $claims := dict
  "services-postgres-data" .Values.postgres.storage
  "adguard-data" .Values.adguard.storage
  "polylearn-config" .Values.polylearn.storage
  "idea-triage-exports" .Values.ideaTriage.exportsStorage
  "n8n-config" .Values.n8n.configStorage
  "n8n-files" .Values.n8n.filesStorage
  "openclaw-data" .Values.openclaw.storage
-}}
{{- range $name, $size := $claims }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ $name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "services.labels" $ | nindent 4 }}
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: {{ $.Values.storageClass | quote }}
  resources:
    requests:
      storage: {{ $size | quote }}
---
{{- end }}
