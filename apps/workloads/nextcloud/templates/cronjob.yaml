{{- /* Nextcloud's own recommended background-job runner, replacing the
       default AJAX cron. Pod-affinitied to the same node as the nextcloud
       Deployment so it can attach the same RWO Longhorn volumes without
       waiting on a cross-node detach/attach. */}}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: nextcloud-cron
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: nextcloud-cron
    {{- include "nextcloud.labels" . | nindent 4 }}
spec:
  schedule: "*/5 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      template:
        metadata:
          labels:
            app.kubernetes.io/name: nextcloud-cron
            app.kubernetes.io/part-of: nextcloud
        spec:
          restartPolicy: Never
          affinity:
            podAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                - labelSelector:
                    matchLabels:
                      app.kubernetes.io/name: nextcloud
                  topologyKey: kubernetes.io/hostname
          securityContext:
            runAsUser: 33
            fsGroup: 33
            fsGroupChangePolicy: OnRootMismatch
          containers:
            - name: cron
              image: {{ .Values.nextcloud.image | quote }}
              imagePullPolicy: IfNotPresent
              command: ["php", "-f", "/var/www/html/cron.php"]
              env:
                - name: TZ
                  value: Europe/Amsterdam
              resources:
                {{- toYaml .Values.nextcloud.cron.resources | nindent 16 }}
              volumeMounts:
                - name: config
                  mountPath: /var/www/html
                - name: data
                  mountPath: /var/www/html/data
          volumes:
            - name: config
              persistentVolumeClaim:
                claimName: nextcloud-config
            - name: data
              persistentVolumeClaim:
                claimName: nextcloud-data
