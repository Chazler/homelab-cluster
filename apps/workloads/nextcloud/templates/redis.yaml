{{- /* File locking and transient caching only -- no persistence, safe to
       lose on restart. Required so concurrent WebDAV/desktop-sync clients
       don't corrupt files with overlapping writes. */}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nextcloud-redis
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: nextcloud-redis
    {{- include "nextcloud.labels" . | nindent 4 }}
spec:
  replicas: 1
  revisionHistoryLimit: {{ .Values.revisionHistoryLimit }}
  selector:
    matchLabels:
      app.kubernetes.io/name: nextcloud-redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nextcloud-redis
        app.kubernetes.io/part-of: nextcloud
    spec:
      containers:
        - name: redis
          image: {{ .Values.redis.image | quote }}
          imagePullPolicy: IfNotPresent
          args:
            - --requirepass
            - $(REDIS_PASSWORD)
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: nextcloud-secrets
                  key: REDIS_PASSWORD
          ports:
            - name: redis
              containerPort: 6379
          startupProbe:
            tcpSocket:
              port: redis
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            tcpSocket:
              port: redis
            periodSeconds: 10
          resources:
            {{- toYaml .Values.redis.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: nextcloud-redis
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    app.kubernetes.io/name: nextcloud-redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis
