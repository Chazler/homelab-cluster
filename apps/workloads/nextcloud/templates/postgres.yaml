apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: nextcloud-postgres
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: nextcloud-postgres
    {{- include "nextcloud.labels" . | nindent 4 }}
spec:
  serviceName: nextcloud-postgres
  replicas: 1
  revisionHistoryLimit: {{ .Values.revisionHistoryLimit }}
  selector:
    matchLabels:
      app.kubernetes.io/name: nextcloud-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nextcloud-postgres
        app.kubernetes.io/part-of: nextcloud
    spec:
      securityContext:
        fsGroup: 999
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: postgres
          image: {{ .Values.postgres.image | quote }}
          imagePullPolicy: IfNotPresent
          env:
            - name: POSTGRES_USER
              value: nextcloud
            - name: POSTGRES_DB
              value: nextcloud
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: nextcloud-secrets
                  key: POSTGRES_PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - name: postgres
              containerPort: 5432
          startupProbe:
            exec:
              command: ["pg_isready", "-U", "nextcloud"]
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "nextcloud"]
            periodSeconds: 10
          resources:
            {{- toYaml .Values.postgres.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: nextcloud-postgres-data
---
apiVersion: v1
kind: Service
metadata:
  name: nextcloud-postgres
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    app.kubernetes.io/name: nextcloud-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
