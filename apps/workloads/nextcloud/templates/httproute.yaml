{{- /* The browser web UI stays behind Authentik forward-auth (defense in
       depth on top of Nextcloud's own login). Sync clients, mobile apps,
       CalDAV/CardDAV clients and any MCP integration authenticate with
       Nextcloud app passwords/tokens over WebDAV or the OCS API and can't
       complete a browser SSO redirect, so those paths get their own
       unauthenticated-at-the-gateway route -- same pattern as n8n's
       webhook/MCP split. Public share links (/public.php, /s/) are
       unauthenticated by design regardless of SSO. */}}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: nextcloud-public
  namespace: {{ .Release.Namespace }}
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: {{ .Values.gateway.name }}
      namespace: {{ .Values.gateway.namespace }}
      sectionName: {{ .Values.gateway.sectionName }}
  hostnames:
    - {{ .Values.hostname | quote }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /remote.php
        - path:
            type: PathPrefix
            value: /public.php
        - path:
            type: PathPrefix
            value: /ocs
        - path:
            type: PathPrefix
            value: /status.php
        - path:
            type: PathPrefix
            value: /index.php/login/v2
        - path:
            type: PathPrefix
            value: /login/v2
        - path:
            type: PathPrefix
            value: /s/
        - path:
            type: PathPrefix
            value: /.well-known/carddav
        - path:
            type: PathPrefix
            value: /.well-known/caldav
        - path:
            type: PathPrefix
            value: /.well-known/webfinger
        - path:
            type: PathPrefix
            value: /.well-known/nodeinfo
      backendRefs:
        - group: ""
          kind: Service
          name: nextcloud
          port: 80
          weight: 1
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: nextcloud
  namespace: {{ .Release.Namespace }}
  labels:
    authentik-forward-auth: "true"
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: {{ .Values.gateway.name }}
      namespace: {{ .Values.gateway.namespace }}
      sectionName: {{ .Values.gateway.sectionName }}
  hostnames:
    - {{ .Values.hostname | quote }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: ""
          kind: Service
          name: nextcloud
          port: 80
          weight: 1
