{{- $routes := list
  (dict "name" "nextcloud" "requests" 600)
  (dict "name" "nextcloud-public" "requests" 600)
-}}
{{- range $route := $routes }}
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: {{ $route.name }}-rate-limit
  namespace: {{ $.Release.Namespace }}
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: {{ $route.name }}
  rateLimit:
    type: Local
    local:
      # Per-Envoy-replica counters (no shared global store), so the effective
      # ceiling per client is roughly limit * replica count. Kept generous:
      # sync clients and WebDAV fan out into many small requests.
      rules:
        - clientSelectors:
            - sourceCIDR:
                invert: false
                type: Distinct
                value: 0.0.0.0/0
          limit:
            requests: {{ $route.requests }}
            unit: Minute
        - clientSelectors:
            - sourceCIDR:
                invert: false
                type: Distinct
                value: ::/0
          limit:
            requests: {{ $route.requests }}
            unit: Minute
---
{{- end }}
