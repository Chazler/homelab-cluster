replicaCount: 2
revisionHistoryLimit: 3

# GHCR is private; this secret is created via templates/sealed-secret.yaml (generated by kubeseal).
imagePullSecrets:
  - ghcr-image-pull-secret

image:
  repository: ghcr.io/chazler/portfolio
  digest: sha256:a2ecc543a18c7a01407b1c5d907ad2df2e12d1b19283e6b2c7fde22ac4fee628
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80

route:
  enabled: true
  hostname: joeriberman.nl
  labels: {}
  parentGateway:
    group: gateway.networking.k8s.io
    kind: Gateway
    name: envoy-gateway
    namespace: envoy-gateway
    sectionName: web-https-apex
  backend:
    group: ''
    kind: Service
    serviceName: ''
    port: 80
    weight: 1

probes:
  enabled: true
  path: /health
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 2
  failureThreshold: 3

serverApi:
  image: joeriberman/server-api:latest@sha256:5b8f5f5efac77b1eee29613e2909967f88be20f8df73ca66cb6a61013ecd6b64
  secretName: server-api-env
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      memory: 256Mi
