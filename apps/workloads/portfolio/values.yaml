replicaCount: 2
revisionHistoryLimit: 3

# GHCR is private; this secret is created via templates/sealed-secret.yaml (generated by kubeseal).
imagePullSecrets:
  - ghcr-image-pull-secret

image:
  repository: ghcr.io/chazler/portfolio
  digest: sha256:3fccc141fd2cfb36100895aba23db7483e0fd84cb4173d4bc1fe026235fa67bb
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80

route:
  enabled: true
  hostname: joeriberman.nl
  labels: {}
  parentGateway:
    group: gateway.networking.k8s.io
    kind: Gateway
    name: envoy-gateway
    namespace: envoy-gateway
    sectionName: web-https-apex
  backend:
    group: ''
    kind: Service
    serviceName: ''
    port: 80
    weight: 1

probes:
  enabled: true
  path: /health
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 2
  failureThreshold: 3
