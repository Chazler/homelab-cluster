replicaCount: 2
revisionHistoryLimit: 3

# GHCR is private; this secret is created via templates/sealed-secret.yaml (generated by kubeseal).
imagePullSecrets:
  - ghcr-image-pull-secret

image:
  repository: ghcr.io/chazler/portfolio
  digest: sha256:d36097499502a17a46ccc9cdecf08b3379a5caaa506b987be67cf85178a2d095
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80

route:
  enabled: true
  hostname: joeriberman.nl
  labels: {}
  parentGateway:
    group: gateway.networking.k8s.io
    kind: Gateway
    name: envoy-gateway
    namespace: envoy-gateway
    sectionName: web-https-apex
  backend:
    group: ''
    kind: Service
    serviceName: ''
    port: 80
    weight: 1

probes:
  enabled: true
  path: /health
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 2
  failureThreshold: 3

serverApi:
  image: joeriberman/server-api:latest@sha256:799ff68f9352910dd38a65c631a4b051a2094d69aefba6707f4e6253d200c9ab
  secretName: server-api-env
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      memory: 256Mi
