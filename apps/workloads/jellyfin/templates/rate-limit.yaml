apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: {{ include "jellyfin.fullname" . }}-rate-limit
  namespace: {{ .Release.Namespace }}
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: {{ include "jellyfin.fullname" . }}
  rateLimit:
    type: Local
    local:
      # Per-Envoy-replica counters (no shared global store), so the effective
      # ceiling per client is roughly limit * replica count. Kept generous:
      # a single playback session fans out into many segment/artwork/sync
      # requests.
      rules:
        - clientSelectors:
            - sourceCIDR:
                invert: false
                type: Distinct
                value: 0.0.0.0/0
          limit:
            requests: 600
            unit: Minute
        - clientSelectors:
            - sourceCIDR:
                invert: false
                type: Distinct
                value: ::/0
          limit:
            requests: 600
            unit: Minute
---
{{- range $name, $route := .Values.publicRoutes }}
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: {{ $name }}-rate-limit
  namespace: {{ $.Release.Namespace }}
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: {{ $name }}
  rateLimit:
    type: Local
    local:
      rules:
        - clientSelectors:
            - sourceCIDR:
                invert: false
                type: Distinct
                value: 0.0.0.0/0
          limit:
            requests: 120
            unit: Minute
        - clientSelectors:
            - sourceCIDR:
                invert: false
                type: Distinct
                value: ::/0
          limit:
            requests: 120
            unit: Minute
---
{{- end }}
