{{- if .Values.jellystat.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: jellystat-config
  namespace: {{ .Release.Namespace }}
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: {{ .Values.persistence.storageClass | quote }}
  resources:
    requests:
      storage: {{ .Values.jellystat.configSize }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: jellystat-db
  namespace: {{ .Release.Namespace }}
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: {{ .Values.persistence.storageClass | quote }}
  resources:
    requests:
      storage: {{ .Values.jellystat.database.size }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jellystat-db
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: jellystat-db
  template:
    metadata:
      labels:
        app.kubernetes.io/name: jellystat-db
        app.kubernetes.io/part-of: {{ include "jellyfin.name" . }}
    spec:
      nodeSelector:
        kubernetes.io/hostname: {{ .Values.nodeName | quote }}
      securityContext:
        fsGroup: 999
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: postgres
          image: {{ .Values.jellystat.database.image | quote }}
          imagePullPolicy: IfNotPresent
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.jellystat.database.secretName }}
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.jellystat.database.secretName }}
                  key: POSTGRES_PASSWORD
          ports:
            - name: postgres
              containerPort: 5432
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\""]
            periodSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: jellystat-db
---
apiVersion: v1
kind: Service
metadata:
  name: jellystat-db
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    app.kubernetes.io/name: jellystat-db
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jellystat
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: jellystat
  template:
    metadata:
      labels:
        app.kubernetes.io/name: jellystat
        app.kubernetes.io/part-of: {{ include "jellyfin.name" . }}
    spec:
      nodeSelector:
        kubernetes.io/hostname: {{ .Values.nodeName | quote }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      initContainers:
        - name: wait-for-restore
          image: alpine:3.21
          command: ["sh", "-c", "until test -f /config/.restore-complete; do sleep 5; done"]
          volumeMounts:
            - name: config
              mountPath: /config
      containers:
        - name: jellystat
          image: {{ .Values.jellystat.image | quote }}
          imagePullPolicy: IfNotPresent
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.jellystat.database.secretName }}
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.jellystat.database.secretName }}
                  key: POSTGRES_PASSWORD
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.jellystat.database.secretName }}
                  key: JWT_SECRET
            - name: POSTGRES_IP
              value: jellystat-db
            - name: POSTGRES_PORT
              value: "5432"
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: TZ
              value: Europe/Amsterdam
          ports:
            - name: http
              containerPort: {{ .Values.jellystat.port }}
          startupProbe:
            tcpSocket:
              port: http
            failureThreshold: 60
            periodSeconds: 5
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
          volumeMounts:
            - name: config
              mountPath: /config
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: jellystat-config
---
apiVersion: v1
kind: Service
metadata:
  name: jellystat
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    app.kubernetes.io/name: jellystat
  ports:
    - name: http
      port: {{ .Values.jellystat.port }}
      targetPort: http
{{- end }}
