{{- range $name, $route := .Values.publicRoutes }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $name }}
  namespace: {{ $.Release.Namespace }}
spec:
  parentRefs:
    - name: {{ $.Values.route.parentGateway.name }}
      namespace: {{ $.Values.route.parentGateway.namespace }}
      sectionName: {{ $.Values.route.parentGateway.sectionName }}
  hostnames:
    - {{ $route.hostname | quote }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: {{ $name }}
          port: {{ $route.port }}
---
{{- end }}
