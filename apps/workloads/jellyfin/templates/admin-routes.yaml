{{- range $name, $route := .Values.adminRoutes }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    authentik-forward-auth: "true"
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: {{ $.Values.route.parentGateway.name }}
      namespace: {{ $.Values.route.parentGateway.namespace }}
      sectionName: {{ $.Values.route.parentGateway.sectionName }}
  hostnames:
    - {{ $route.hostname | quote }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: ""
          kind: Service
          name: {{ $name }}
          port: {{ $route.port }}
          weight: 1
---
{{- end }}
