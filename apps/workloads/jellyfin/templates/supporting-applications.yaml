{{- if .Values.supportingServices.enabled }}
{{- range $name, $app := .Values.supportingServices.applications }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ $name }}
    app.kubernetes.io/part-of: {{ include "jellyfin.name" $ }}
spec:
  replicas: 1
  revisionHistoryLimit: {{ $.Values.revisionHistoryLimit }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ $name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ $name }}
        app.kubernetes.io/part-of: {{ include "jellyfin.name" $ }}
    spec:
      nodeSelector:
        kubernetes.io/hostname: {{ $.Values.nodeName | quote }}
      securityContext:
        {{- toYaml $.Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ $name }}
          image: {{ $app.image | quote }}
          imagePullPolicy: IfNotPresent
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: TZ
              value: Europe/Amsterdam
            {{- range $key, $value := ($app.environment | default dict) }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
          ports:
            - name: http
              containerPort: {{ $app.port }}
          volumeMounts:
            - name: config
              mountPath: {{ $app.configMountPath }}
            {{- if $app.mountMedia }}
            - name: media
              mountPath: /data
              readOnly: {{ $.Values.media.readOnly }}
            {{- end }}
          startupProbe:
            tcpSocket:
              port: http
            failureThreshold: 60
            periodSeconds: 5
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: {{ $name }}-config
        {{- if $app.mountMedia }}
        - name: media
          persistentVolumeClaim:
            claimName: {{ $.Values.media.claimName }}
        {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ $name }}
    app.kubernetes.io/part-of: {{ include "jellyfin.name" $ }}
spec:
  selector:
    app.kubernetes.io/name: {{ $name }}
  ports:
    - name: http
      port: {{ $app.port }}
      targetPort: http
---
{{- end }}
{{- end }}
