{{- if .Values.restoreHelper.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "jellyfin.fullname" . }}-restore-helper
  labels:
    {{- include "jellyfin.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "jellyfin.name" . }}-restore-helper
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "jellyfin.name" . }}-restore-helper
    spec:
      nodeSelector:
        kubernetes.io/hostname: {{ .Values.nodeName | quote }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: restore-helper
          image: alpine:3.21
          command: ["sh", "-c", "sleep infinity"]
          securityContext:
            {{- toYaml .Values.restoreHelperSecurityContext | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /config
            {{- range $name, $_ := .Values.supportingServices.applications }}
            - name: {{ $name }}-config
              mountPath: /restore/{{ $name }}
            {{- end }}
            - name: jellystat-config
              mountPath: /restore/jellystat
            - name: deluge-config
              mountPath: /restore/deluge
            - name: vpn-config
              mountPath: /restore/vpn
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: {{ include "jellyfin.fullname" . }}-config
        {{- range $name, $_ := .Values.supportingServices.applications }}
        - name: {{ $name }}-config
          persistentVolumeClaim:
            claimName: {{ $name }}-config
        {{- end }}
        - name: jellystat-config
          persistentVolumeClaim:
            claimName: jellystat-config
        - name: deluge-config
          persistentVolumeClaim:
            claimName: deluge-config
        - name: vpn-config
          persistentVolumeClaim:
            claimName: vpn-config
{{- end }}
