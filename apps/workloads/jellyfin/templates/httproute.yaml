apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "jellyfin.fullname" . }}
  namespace: {{ .Release.Namespace }}
spec:
  parentRefs:
    - name: {{ .Values.route.parentGateway.name }}
      namespace: {{ .Values.route.parentGateway.namespace }}
      sectionName: {{ .Values.route.parentGateway.sectionName }}
  hostnames:
    - {{ .Values.route.hostname | quote }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: {{ include "jellyfin.fullname" . }}
          port: {{ .Values.service.port }}
