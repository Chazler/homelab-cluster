replicaCount: 1

nodeName: k8s-worker-2

image:
  ref: linuxserver/jellyfin@sha256:b8dcc7b71d0ea872b74314da4b995c0cf282b1778438c295996e7be88c70fdda
  pullPolicy: IfNotPresent

persistence:
  storageClass: platform-rwo
  size: 10Gi

media:
  persistentVolumeName: jellyfin-media
  claimName: media-data
  capacity: 23Ti
  hostPath: /var/mnt/vault/media/downloadbox/data
  readOnly: true

service:
  port: 8096

route:
  hostname: jellyfin.joeriberman.nl
  parentGateway:
    name: envoy-gateway
    namespace: envoy-gateway
    sectionName: web-https

# The helper remains enabled until every PVC has been restored and checked.
restoreHelper:
  enabled: true

podSecurityContext:
  fsGroup: 1000
  fsGroupChangePolicy: OnRootMismatch

restoreHelperSecurityContext:
  runAsUser: 0
  runAsGroup: 0

resources:
  requests:
    cpu: 100m
    memory: 512Mi
  limits:
    memory: 2Gi

supportingServices:
  enabled: true
  applications:
    jellyseerr:
      image: fallenbagel/jellyseerr@sha256:4538137bc5af902dece165f2bf73776d9cf4eafb6dd714670724af8f3eb77764
      port: 5055
      configMountPath: /app/config
      configSize: 2Gi
      mountMedia: false
    sonarr:
      image: linuxserver/sonarr@sha256:373159ba768e23a3a1c497d9f2b936addf8fd5b1fdce7dd6a14080ac928bfda0
      port: 8989
      configMountPath: /config
      configSize: 5Gi
      mountMedia: true
    sonarr-anime:
      image: linuxserver/sonarr@sha256:373159ba768e23a3a1c497d9f2b936addf8fd5b1fdce7dd6a14080ac928bfda0
      port: 8990
      configMountPath: /config
      configSize: 5Gi
      mountMedia: true
      environment:
        SONARR_PORT: "8990"
    radarr:
      image: linuxserver/radarr@sha256:a45b5ab0f850f39edb4cc9c95bbd967b52ddc3d4574a4dfb45561177db6c88f4
      port: 7878
      configMountPath: /config
      configSize: 5Gi
      mountMedia: true
    bazarr:
      image: linuxserver/bazarr@sha256:b3d44d324399152be4d50775ff639a364c0fa1cfda67f71b1f38264c4d0ca09f
      port: 6767
      configMountPath: /config
      configSize: 5Gi
      mountMedia: true
    prowlarr:
      image: linuxserver/prowlarr@sha256:1295cff29d10b486c0d8324d1559a552140a5932bf8b3d87e398654414f63f92
      port: 9696
      configMountPath: /config
      configSize: 2Gi
      mountMedia: false
    sabnzbd:
      image: lscr.io/linuxserver/sabnzbd@sha256:b0f9755d795913bd26ae3f3a12805668ab0681ab847a7624568559c573fc7cae
      port: 8080
      configMountPath: /config
      configSize: 2Gi
      mountMedia: true

jellystat:
  enabled: true
  image: cyfershepard/jellystat@sha256:c4e2dfa8bddf8d5ac3a675d7202f71a54dcfe3540cc186899d9201e0fe701fa5
  port: 3000
  configSize: 1Gi
  database:
    image: postgres@sha256:78a275d4c891f7b3a33d3f1a78eda9f1d744954d9e20122bfdc97cdda25cddaf
    size: 5Gi
    secretName: jellystat-secrets

deluge:
  enabled: true
  image: linuxserver/deluge@sha256:33a939576f7ecfc1227db1a0cb2afce030ce983e620ec9d93c956e3700e21fe9
  vpnImage: dperson/openvpn-client@sha256:d174047b57d51734143325ad7395210643025e6516ba60a937e9319dbb462293
  port: 8112
  configSize: 2Gi
  vpnConfigSize: 1Gi
