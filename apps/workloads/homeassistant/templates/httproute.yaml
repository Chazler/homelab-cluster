{{- if .Values.route.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "homeassistant.fullname" . }}
  namespace: {{ .Release.Namespace }}
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: {{ .Values.route.parentGateway.name }}
      namespace: {{ .Values.route.parentGateway.namespace }}
      sectionName: {{ .Values.route.parentGateway.sectionName }}
  hostnames:
    - {{ .Values.route.hostname | quote }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: ""
          kind: Service
          name: {{ include "homeassistant.fullname" . }}
          port: {{ .Values.service.port }}
          weight: 1
{{- end }}
