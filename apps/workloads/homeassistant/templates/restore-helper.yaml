{{- if .Values.restoreHelper.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "homeassistant.fullname" . }}-restore-helper
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "homeassistant.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "homeassistant.name" . }}-restore-helper
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "homeassistant.name" . }}-restore-helper
    spec:
      nodeSelector:
        kubernetes.io/hostname: {{ .Values.nodeName | quote }}
      containers:
        - name: restore-helper
          image: alpine:3.21
          command: ["sh", "-c", "sleep infinity"]
          securityContext:
            runAsUser: 0
            runAsGroup: 0
          volumeMounts:
            - name: config
              mountPath: /config
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: {{ include "homeassistant.fullname" . }}-config
{{- end }}
