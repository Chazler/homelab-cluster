{{- if .Values.route.enabled }}
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: {{ include "homeassistant.fullname" . }}-rate-limit
  namespace: {{ .Release.Namespace }}
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: {{ include "homeassistant.fullname" . }}
  rateLimit:
    type: Local
    local:
      # Per-Envoy-replica counters (no shared global store), so the effective
      # ceiling per client is roughly limit * replica count. Kept generous
      # since companion apps poll/hold long-lived websocket connections.
      rules:
        - clientSelectors:
            - sourceCIDR:
                type: Distinct
                value: 0.0.0.0/0
          limit:
            requests: 300
            unit: Minute
        - clientSelectors:
            - sourceCIDR:
                type: Distinct
                value: ::/0
          limit:
            requests: 300
            unit: Minute
{{- end }}
